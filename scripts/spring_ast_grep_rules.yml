# spring_ast_grep_rules.yml
#
# ast-grep rule config for spring_signal_scan.py's Java structural detection.
# Loaded with: ast-grep scan --rule <this file> --json=compact <path>
#
# Each rule's `id` is "<bucket>__<subkind>" — spring_signal_scan.py splits on
# "__" and files every match under `evidence[bucket]`. `persistence__entity`
# and `persistence__repository` both follow that convention (so they land
# in evidence.persistence like every other rule) but are relational (kind +
# has), not literal patterns: they locate the right class/interface
# declaration structurally, and spring_signal_scan.py regexes the *matched
# node's own text* (never the whole file) to pull out NAME/TABLE/ENTITY/ID.
# `persistence__entity` gets one more layer of special-casing in Python on
# top of that — it's the only rule whose matches also build
# entity_table_map, not just an evidence-bucket entry.
#
# Written and empirically verified against synthetic fixtures, including
# the cases that broke the first draft of this file:
#   - multi-line annotations (@Query spanning several lines)
#   - argument-order independence (@Query(value=..., nativeQuery=true) vs
#     @Query(nativeQuery=true, value=...), @Table(schema=..., name=...))
#   - modifier sensitivity (public interface vs bare interface)
#   - annotation-adjacency brittleness: a literal pattern like
#     "@Entity\n@Table(...)\npublic class $NAME {$$$}" stops matching the
#     instant another annotation (@EntityListeners, @Cacheable, ...) sits
#     between @Entity and the class, or a bare "@Entity\npublic class X"
#     literal pattern stops matching once ANY other annotation is added —
#     both are extremely common in real Spring code. Same failure mode hit
#     "public interface $NAME extends JpaRepository<$ENTITY, $ID> {$$$}"
#     the moment a @Repository annotation preceded the interface. Fixed by
#     switching both to kind+has relational rules (order/count of *other*
#     annotations no longer matters), confirmed against a real, large
#     production Spring Boot codebase as well as synthetic fixtures.
#   - see scripts/test_spring_signal_scan.py for the fixtures and expected
#     counts this file's rules are pinned against.

  # ---- api_surface ----
---
id: api_surface__controller
language: java
rule:
  any:
    - pattern: "@RestController"
    - pattern: "@Controller"
---
id: api_surface__mapping
language: java
rule:
  any:
    - pattern: "@GetMapping"
    - pattern: "@GetMapping($$$ARGS)"
    - pattern: "@PostMapping"
    - pattern: "@PostMapping($$$ARGS)"
    - pattern: "@PutMapping"
    - pattern: "@PutMapping($$$ARGS)"
    - pattern: "@PatchMapping"
    - pattern: "@PatchMapping($$$ARGS)"
    - pattern: "@DeleteMapping"
    - pattern: "@DeleteMapping($$$ARGS)"
    - pattern: "@RequestMapping"
    - pattern: "@RequestMapping($$$ARGS)"

  # ---- outbound_clients ----
---
id: outbound_clients__feign
language: java
rule:
  pattern: "@FeignClient($$$ARGS)"
---
id: outbound_clients__import
language: java
rule:
  kind: import_declaration
  regex: "\\.(RestTemplate|WebClient|RestClient)(;|\\.)"
---
id: outbound_clients__type_usage
language: java
rule:
  kind: type_identifier
  regex: "^(RestTemplate|WebClient|RestClient)$"

  # ---- messaging ----
---
id: messaging__listener
language: java
rule:
  any:
    - pattern: "@KafkaListener"
    - pattern: "@KafkaListener($$$ARGS)"
    - pattern: "@RabbitListener"
    - pattern: "@RabbitListener($$$ARGS)"
    - pattern: "@JmsListener"
    - pattern: "@JmsListener($$$ARGS)"
    - pattern: "@SqsListener"
    - pattern: "@SqsListener($$$ARGS)"
---
id: messaging__import
language: java
rule:
  kind: import_declaration
  regex: "\\.(KafkaTemplate|RabbitTemplate|JmsTemplate|SqsTemplate)(;|\\.)"
---
id: messaging__type_usage
language: java
rule:
  kind: type_identifier
  regex: "^(KafkaTemplate|RabbitTemplate|JmsTemplate|SqsTemplate)$"

  # ---- persistence: entities (feed entity_table_map, not a bucket) ----
  # Relational, not literal: matches any class carrying @Entity anywhere
  # among its annotations, regardless of what else is stacked alongside it
  # or in what order. NAME/TABLE are pulled from the matched text in
  # Python, not from ast-grep meta-variables.
---
id: persistence__entity
language: java
rule:
  kind: class_declaration
  has:
    kind: marker_annotation
    regex: "^@Entity$"
    stopBy: end

  # ---- persistence: repositories ----
  # Relational for the same reason as persistence__entity: a literal
  # "public interface $NAME extends JpaRepository<...> {$$$}" pattern
  # breaks the moment @Repository (or any annotation) precedes the
  # interface. This instead locates the extends-clause structurally and
  # lets Python regex NAME/ENTITY/ID out of the matched interface's own
  # text.
---
id: persistence__repository
language: java
rule:
  kind: interface_declaration
  has:
    kind: extends_interfaces
    stopBy: end
    has:
      kind: generic_type
      stopBy: end
      has:
        kind: type_identifier
        regex: "^(JpaRepository|CrudRepository|PagingAndSortingRepository|MongoRepository|ReactiveCrudRepository)$"

  # ---- raw_queries (jpql vs native split happens in Python, from $$$ARGS) ----
---
id: raw_queries__query
language: java
rule:
  pattern: "@Query($$$ARGS)"

  # ---- security ----
---
id: security__method
language: java
rule:
  any:
    - pattern: "@PreAuthorize($$$ARGS)"
    - pattern: "@PostAuthorize($$$ARGS)"
    - pattern: "@Secured($$$ARGS)"
    - pattern: "@Secured"
    - pattern: "@RolesAllowed($$$ARGS)"
    - pattern: "@RolesAllowed"
---
id: security__config
language: java
rule:
  any:
    - pattern: "@EnableWebSecurity"
    - pattern: "@EnableMethodSecurity"
    - pattern: "@EnableMethodSecurity($$$ARGS)"
---
id: security__filterchain_type
language: java
rule:
  kind: type_identifier
  regex: "^SecurityFilterChain$"

  # ---- configuration ----
---
id: configuration__properties
language: java
rule:
  any:
    - pattern: "@ConfigurationProperties"
    - pattern: "@ConfigurationProperties($$$ARGS)"
    - pattern: "@Value($$$ARGS)"

  # ---- error_handling ----
---
id: error_handling__advice
language: java
rule:
  any:
    - pattern: "@ControllerAdvice"
    - pattern: "@ControllerAdvice($$$ARGS)"
    - pattern: "@RestControllerAdvice"
    - pattern: "@RestControllerAdvice($$$ARGS)"
    - pattern: "@ExceptionHandler"
    - pattern: "@ExceptionHandler($$$ARGS)"

  # ---- observability ----
---
id: observability__timed
language: java
rule:
  any:
    - pattern: "@Timed"
    - pattern: "@Timed($$$ARGS)"
---
id: observability__meterregistry_type
language: java
rule:
  kind: type_identifier
  regex: "^MeterRegistry$"
---
id: observability__import
language: java
rule:
  kind: import_declaration
  regex: "^import (io\\.micrometer|io\\.opentelemetry)\\."

  # ---- testing ----
---
id: testing__springboottest
language: java
rule:
  any:
    - pattern: "@SpringBootTest"
    - pattern: "@SpringBootTest($$$ARGS)"

  # Scope widened 2026-07-25. This rule matched testcontainers only, while
  # being named as if it covered test imports generally. Measured on a real
  # 615-file Spring service: testing__springboottest fired 16 times and this
  # rule fired 0, because all 16 `import org.springframework.boot.test...`
  # lines fell only into the generic `references` bucket. The name promised
  # more than the regex delivered, and nothing flagged the gap.
---
id: testing__import
language: java
rule:
  kind: import_declaration
  regex: "^import (org\\.testcontainers|org\\.springframework\\.boot\\.test|org\\.springframework\\.test|org\\.junit|org\\.mockito)\\."

  # ---- references (repo-wide import/package index, not a documentation
  # bucket) ----
  # Plain import_declaration / package_declaration captures, no narrowing
  # regex to any specific type — unlike outbound_clients__import /
  # messaging__import / observability__import / testing__import above,
  # which each look for one specific set of framework types. This exists
  # so file-summarizer (Stage 1) can consult a repo-wide reference index
  # for cross-group relationships (e.g. a controller in one group calling
  # a service in another), which its own per-group file view otherwise has
  # no way to see. ast-grep already parses every file's full AST for the
  # other rules in this file anyway, so this is marginal cost, not a new
  # pass. (That used to read "the 21 rules above" and went stale the first
  # time a rule was added; the count is recoverable with
  # `python3 scripts/rule_coverage.py`, which prints it.) See
  # spring_signal_scan.py's scan() "references" bucket and
  # file-summarizer.md step 3 for how this actually gets consumed — this
  # rule alone only builds the index, it doesn't do any relationship
  # resolution itself.
---
id: references__import
language: java
rule:
  kind: import_declaration
---
id: references__package
language: java
rule:
  kind: package_declaration

  # Bean stereotypes. This closes the gap file-summarizer.md step 3 states
  # outright: the import/package graph cannot see interface-mediated DI,
  # because matching an implementer to an interface needs @Service/@Component
  # scanning, not imports. It lives in `references` rather than a new bucket
  # for the same reason the two rules above do — this is index material for
  # cross-group relationship resolution, not a documentation bucket of its
  # own, and adding a bucket would ripple into the fourteen-file taxonomy.
  # Measured on a real 615-file service: @Service 51, @Repository 7,
  # @Component 2, @Configuration 4, none of which any rule saw before.
  #
  # Both annotation shapes are listed on purpose. A marker annotation and an
  # argument-bearing one are disjoint node shapes, so `@Service` alone misses
  # every `@Service("name")` — the same defect that made a `@Column` probe
  # report zero against 122 real occurrences while this change was being
  # written.
---
id: references__stereotype
language: java
rule:
  any:
    - pattern: "@Service"
    - pattern: "@Service($$$ARGS)"
    - pattern: "@Component"
    - pattern: "@Component($$$ARGS)"
    - pattern: "@Repository"
    - pattern: "@Repository($$$ARGS)"
    - pattern: "@Configuration"
    - pattern: "@Configuration($$$ARGS)"

  # ---- persistence: JPA mapping detail ----
  # database.md documents schema, but the scanner saw only @Entity and
  # @Table, so column names, join columns and relationship cardinality were
  # invisible to every claim it made. Measured on the same real service:
  # @Column 122, @JoinColumn 53, @ManyToOne 47, @OneToMany 47, @Id 15.
---
id: persistence__column
language: java
rule:
  any:
    - pattern: "@Column"
    - pattern: "@Column($$$ARGS)"
---
id: persistence__join_column
language: java
rule:
  any:
    - pattern: "@JoinColumn"
    - pattern: "@JoinColumn($$$ARGS)"
    - pattern: "@JoinTable"
    - pattern: "@JoinTable($$$ARGS)"
---
id: persistence__relation
language: java
rule:
  any:
    - pattern: "@ManyToOne"
    - pattern: "@ManyToOne($$$ARGS)"
    - pattern: "@OneToMany"
    - pattern: "@OneToMany($$$ARGS)"
    - pattern: "@ManyToMany"
    - pattern: "@ManyToMany($$$ARGS)"
    - pattern: "@OneToOne"
    - pattern: "@OneToOne($$$ARGS)"
---
id: persistence__id
language: java
rule:
  any:
    - pattern: "@Id"
    - pattern: "@EmbeddedId"
    - pattern: "@GeneratedValue"
    - pattern: "@GeneratedValue($$$ARGS)"
---
id: persistence__transactional
language: java
rule:
  any:
    - pattern: "@Transactional"
    - pattern: "@Transactional($$$ARGS)"
