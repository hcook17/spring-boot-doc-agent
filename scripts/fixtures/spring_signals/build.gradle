plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.0.13'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.0.13'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.0.13'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.0.13'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.0.6'
    implementation 'io.micrometer:micrometer-core:1.10.12'
    implementation 'org.springframework.kafka:spring-kafka:3.0.13'
    implementation 'org.springframework:spring-jms:6.0.14'
    implementation 'org.testcontainers:postgresql:1.19.3'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.0.13'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
