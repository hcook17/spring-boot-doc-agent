# semgrep rules for the software-architect-and-testing agent (agents/software-
# architect-and-testing.md). Companion to spring_ast_grep_rules.yml, not a
# replacement: ast-grep's tree-sitter patterns are the right tool for a single
# marker/shape (a listener annotation, an interface's generic type argument);
# semgrep is used here specifically for the "presence of A without presence of
# B in the same scope" idiom (pattern + pattern-not, both repeating the outer
# shape with `...`), which is semgrep's idiom, not ast-grep's.
#
# Same id convention as spring_ast_grep_rules.yml: "<bucket>__<subkind>",
# bucket in {architecture_ddia, testing_est} mapping to the two lenses in
# agents/software-architect-and-testing.md. scripts/coverage/semgrep_rule_coverage.py
# parses ids with the same regex rule_coverage.py uses for the ast-grep file.
#
# Every rule below is verified to fire against scripts/coverage/semgrep_rule_fixtures/
# (python3 scripts/coverage/semgrep_rule_coverage.py) -- a rule nobody can make fire is
# not coverage, same standard CONSTRAINTS.md's "Known precision tradeoffs"
# item 10 already holds the ast-grep ruleset to.

rules:
  # ---- architecture_ddia: DDIA-lens architecture smells ----

  - id: architecture_ddia__entity_no_version_field
    languages: [java]
    severity: WARNING
    message: >-
      @Entity class with no @Version field has no optimistic-concurrency
      guard -- concurrent writes to the same row silently last-write-win
      (DDIA 2e ch.6, "last-write-wins is lossy conflict resolution").
    patterns:
      - pattern: |
          @Entity
          class $CLASS {
            ...
          }
      - pattern-not: |
          @Entity
          class $CLASS {
            ...
            @Version
            $VTYPE $VFIELD;
            ...
          }

  - id: architecture_ddia__scheduled_and_kafkalistener_same_class
    languages: [java]
    severity: INFO
    message: >-
      Class mixes @Scheduled (batch) and @KafkaListener (stream) methods --
      worth confirming the two paths can't both process the same fact twice
      (DDIA 2e ch.10-11, the batch/stream duality).
    patterns:
      - pattern-inside: |
          class $CLASS {
            ...
          }
      - pattern-either:
          - pattern: |
              @Scheduled(...)
              $RET $M1(...) { ... }
      - pattern-inside: |
          class $CLASS {
            ...
            @KafkaListener(...)
            $RET2 $M2(...) { ... }
            ...
          }

  - id: architecture_ddia__native_query_string_concatenation
    languages: [java]
    severity: WARNING
    message: >-
      SQL built via string concatenation rather than a parameterized query --
      an implicit, unenforced schema-on-read contract with no compile-time
      check when a column is renamed (DDIA 2e ch.3-5, schema-on-read vs an
      explicit declared schema).
    pattern-either:
      - pattern: $CONN.createStatement().executeQuery($SQL + $X)
      - pattern: $CONN.createStatement().executeUpdate($SQL + $X)
      - pattern: $JDBC.query($SQL + $X, ...)

  - id: architecture_ddia__resttemplate_default_no_timeout
    languages: [java]
    severity: WARNING
    message: >-
      `new RestTemplate()` with the no-arg constructor has no connect/read
      timeout configured -- a stalled downstream call blocks the calling
      thread indefinitely rather than failing fast (DDIA 2e ch.13, partial
      failure and treating faults as probabilistic rather than binary).
    pattern: new RestTemplate()

  - id: architecture_ddia__unbounded_findall_exposed
    languages: [java]
    severity: WARNING
    message: >-
      Controller endpoint returns a repository's full `.findAll()` result
      with no `Pageable` parameter -- an unbounded collection with no
      partitioning at the API boundary (DDIA 2e ch.6, partitioning).
    patterns:
      - pattern-either:
          - pattern: |
              @GetMapping(...)
              $RET $M(...) {
                ...
                return $REPO.findAll();
              }
          - pattern: |
              @GetMapping(...)
              $RET $M(...) {
                ...
                return $VAR;
              }
      - pattern-not: |
          @GetMapping(...)
          $RET $M(..., Pageable $P, ...) { ... }

  # ---- testing_est: Effective Software Testing (Aniche) test smells ----

  - id: testing_est__test_method_no_assertion
    languages: [java]
    severity: WARNING
    message: >-
      @Test method with no assertion call anywhere in its body -- it can only
      ever fail on an uncaught exception, never on wrong behavior (Effective
      Software Testing's assertion-free test smell).
    patterns:
      - pattern: |
          @Test
          $RET $M(...) {
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertTrue(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertFalse(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertEquals(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertNotNull(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertNull(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThrows(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThat(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThat(...).$AM(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            verify(...);
            ...
          }

  - id: testing_est__disabled_test_method
    languages: [java]
    severity: INFO
    message: >-
      Test method disabled rather than fixed or removed -- a silent coverage
      gap that reads as a passing suite (Effective Software Testing's point
      that a skipped test and a passing test must not look the same).
    pattern-either:
      - pattern: |
          @Disabled(...)
          $RET $M(...) { ... }
      - pattern: |
          @Disabled
          $RET $M(...) { ... }
      - pattern: |
          @Ignore
          $RET $M(...) { ... }

  - id: testing_est__empty_catch_in_test
    languages: [java]
    severity: WARNING
    message: >-
      Empty catch block in a test -- swallows the real failure signal instead
      of letting the test fail or asserting on the exception (Effective
      Software Testing's obscure/fragile-test smell).
    patterns:
      - pattern: |
          try {
            ...
          } catch ($EXC $E) {
          }
      - pattern-inside: |
          class $TESTCLASS {
            ...
          }
      - metavariable-regex:
          metavariable: $TESTCLASS
          regex: .*(Test|Tests)$

  - id: testing_est__thread_sleep_in_test
    languages: [java]
    severity: WARNING
    message: >-
      `Thread.sleep(...)` in a test -- a timing-dependent test is a flaky
      test waiting to happen (Effective Software Testing's flakiness
      discussion); prefer polling with a timeout or a test double for the
      clock.
    patterns:
      - pattern: Thread.sleep(...)
      - pattern-inside: |
          class $TESTCLASS {
            ...
          }
      - metavariable-regex:
          metavariable: $TESTCLASS
          regex: .*(Test|Tests)$

  - id: testing_est__mockito_verify_no_assertion
    languages: [java]
    severity: INFO
    message: >-
      Test method verifies a mock interaction but asserts nothing about the
      actual result -- checks that a call happened, never that the outcome
      was right (Effective Software Testing's test-double-discipline
      discussion: a verify is not a substitute for an assertion).
    patterns:
      - pattern: |
          @Test
          $RET $M(...) {
            ...
            verify(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertTrue(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertFalse(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertEquals(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertNotNull(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertNull(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThrows(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThat(...);
            ...
          }
      - pattern-not: |
          @Test
          $RET $M(...) {
            ...
            assertThat(...).$AM(...);
            ...
          }
