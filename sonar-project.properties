# SonarCloud project identity (must match the bound GitHub project).
sonar.projectKey=huntyyyyyy_spring-boot-doc-agent
sonar.organization=huntyyyyyy

sonar.python.version=3.10
sonar.sourceEncoding=UTF-8

# Issue/smell analysis surface. Keep adapters/scripts here so Sonar still
# reports findings; coverage is narrowed separately below.
sonar.sources=src,adapters,scripts
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.test.inclusions=**/test_*.py,**/tests/**/*.py

# Cobertura XML from pytest-cov (CI: test job uploads coverage-xml artifact;
# sonarcloud job downloads it before the scanner runs).
sonar.python.coverage.reportPaths=coverage.xml

# pytest --cov=doc_engine --cov=stf only instruments those packages. Without
# this exclusion, new lines under adapters/ and scripts/ count as uncovered
# and vacate any Coverage on New Code condition.
sonar.coverage.exclusions=adapters/**,scripts/**,**/tests/**,**/*_test.py
