name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history rather than the default shallow clone. The original
          # reason (verify_llms_docs.py resolving old SHAs) went away with
          # that script, but this is kept deliberately: check_llms_coverage.py
          # reasons about merged PRs, and a shallow clone silently changes
          # what git-based checks can see. Cheap at this repo's size, and a
          # shallow default is the kind of thing that fails confusingly later.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 3.11 is a deliberate, modern default, not an assumption carried
          # over from elsewhere. Third-party package versions are pinned in
          # requirements.txt (see CONSTRAINTS.md's "Runtime prerequisites"
          # item 4); the Python interpreter version itself isn't pinned via
          # that file, so this stays a hardcoded default.
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify ast-grep is on PATH
        run: ast-grep --version

      - name: test_spring_signal_scan.py
        run: python3 scripts/test_spring_signal_scan.py -v

      - name: test_partition_repo.py
        run: python3 scripts/test_partition_repo.py -v

      - name: test_spring_drift_check.py
        run: python3 scripts/test_spring_drift_check.py -v

      - name: test_pipeline_stages.py
        run: python3 scripts/test_pipeline_stages.py -v

      - name: test_secret_heuristics.py
        run: python3 scripts/test_secret_heuristics.py -v

      - name: test_config_keys.py
        run: python3 scripts/test_config_keys.py -v

      - name: test_semantic_eval_helpers.py
        run: python3 scripts/test_semantic_eval_helpers.py -v

      - name: test_capacity_preflight.py
        run: python3 scripts/test_capacity_preflight.py -v

      - name: test_run_manifest.py
        run: python3 scripts/test_run_manifest.py -v

      - name: test_build_cross_group_edges.py
        run: python3 scripts/test_build_cross_group_edges.py -v

      - name: test_check_llms_coverage.py
        run: python3 scripts/test_check_llms_coverage.py -v

      # The checker itself isn't CI-wired -- like check_no_secrets_leaked.py,
      # it needs a completed target-repo run to check, and CI has none. Its
      # unit tests do run here.
      - name: test_check_pipeline_output.py
        run: python3 scripts/test_check_pipeline_output.py -v

      # Same shape: citation_coverage.py needs a completed run's docs/ plus the
      # target repo, so only its unit tests run here.
      - name: test_citation_coverage.py
        run: python3 scripts/test_citation_coverage.py -v

      # The kitchen-sink suite: the documented command series run as real
      # subprocesses against a deliberately hostile synthetic enterprise repo,
      # plus fault injection that closes the loop to each gate's actual process
      # exit code -- the two things no other suite here does. It is also the
      # only coverage run_pipeline_local.py has. Organized around DDIA's
      # chapters (encoding, replication, partitioning, lost updates, the
      # end-to-end argument), which is what decides both what it covers and how
      # hard it asserts. Stages 1-4 come from run_pipeline_local.py's mocks.
      #
      # This is the slowest step in the workflow: ~132s locally on Windows,
      # faster here since the cost is process startup rather than work. It
      # carries one deliberate expectedFailure (overlap cascading past adjacent
      # groups) -- if that ever reports an *unexpected success*, the underlying
      # defect was fixed and the marker should be deleted, not re-added.
      #
      # KITCHEN_SINK_REPO is unset on purpose: the opt-in real-repo lane is
      # local-only and outside this workflow's runtime budget.
      - name: test_enterprise_kitchen_sink.py
        run: python3 scripts/test_enterprise_kitchen_sink.py -v

      # REMOVED: the verify_llms_docs.py step. It extracted backtick-fenced
      # spans from LLM-authored markdown and ran them through `bash -c`, with
      # GH_TOKEN in scope, on every pull_request and push to main. The match
      # was on prefix, so any `;` in a span was arbitrary code execution
      # (reproduced: `git log -1; echo X > file` graded PASS, file written).
      # Removed per claude/10-architecture-maturation-plan.md scrap item 2
      # ("delete the mechanism; keep the intent") and 0.1.3 ("the C1 exposure
      # is closed by omission ... do not re-add it").
      #
      # claude/llms/pr-N.md survives as a human-read convention: its commands
      # are for a person to run deliberately, never for CI to execute.

      # NOTE: this step reports only — check_llms_coverage.py has ENFORCE = False,
      # so it prints findings and exits 0. The name says "reports", not "fails", on
      # purpose: a step named as a gate that cannot fail is worse than no gate,
      # because it reads as enforcement to anyone scanning the workflow. Rename
      # this back to "fails on ..." in the same change that sets ENFORCE = True.
      - name: check_llms_coverage.py (reports merged PRs with no claude/llms/pr-N.md; non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_llms_coverage.py
