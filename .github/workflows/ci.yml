name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Pinned CodeQL CLI bundle. The SHA256 must be updated whenever the bundle
  # URL is changed; the version lives in the URL (single source), and the
  # digest is what the setup-codeql action verifies. Digest provenance: the
  # `digest` field of the codeql-bundle-linux64.tar.gz asset in
  #   https://api.github.com/repos/github/codeql-action/releases/tags/codeql-bundle-v2.26.2
  # (verified 2026-08-05; the release also ships a .checksum.txt sidecar for
  # independent re-verification).
  CODEQL_SHA256: cb361567fa1bdb9d322da4240f621b36f245e4d7bb97db3c3a2ad7f743c8e8e7
  CODEQL_BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.2/codeql-bundle-linux64.tar.gz

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported interpreters for the install/test surface. Classifiers also
        # list 3.13; that cell is deferred until this matrix is green. CodeQL
        # jobs below stay on a single runner (no Python matrix) — they exercise
        # the Java QL pack, not the Python package ABI.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history rather than the default shallow clone. The original
          # reason (verify_llms_docs.py resolving old SHAs) went away with
          # that script, but this is kept deliberately: check_llms_coverage.py
          # reasons about merged PRs, and a shallow clone silently changes
          # what git-based checks can see. Cheap at this repo's size, and a
          # shallow default is the kind of thing that fails confusingly later.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install doc-engine package
        run: pip install -e .

      # Fail closed on invalid workflow YAML before any other gate runs.
      # Catches the PR #57 class (unquoted colon in a step name) that Actions
      # rejects as "Invalid workflow file" with no useful Python traceback.
      - name: check_workflow_yaml.py (GitHub Actions YAML parse gate)
        run: python3 scripts/ci/check_workflow_yaml.py

      # Presence is not enough. This step used to run `ast-grep --version` and
      # discard the answer, so it passed while the binary that actually
      # resolved on PATH was a different build from the one requirements.txt
      # pins -- exactly the shadowing recorded in claude/tool-quirks.md, which
      # was live on a dev machine while this step was green. The pinned
      # version is read from requirements.txt rather than written here, so
      # there is no second number to go stale.
      - name: Verify ast-grep on PATH matches the pin
        run: |
          python3 - <<'PY'
          import re, shutil, subprocess, sys, pathlib
          pin = re.search(r"^ast-grep-cli~=(\d+)\.(\d+)\.",
                          pathlib.Path("requirements.txt").read_text(), re.M)
          if not pin:
              sys.exit("requirements.txt does not pin ast-grep-cli")
          binary = shutil.which("ast-grep")
          if not binary:
              sys.exit("ast-grep is not on PATH")
          out = subprocess.run([binary, "--version"], capture_output=True,
                               text=True).stdout.strip()
          got = re.search(r"(\d+)\.(\d+)\.(\d+)", out)
          if not got:
              sys.exit(f"could not parse a version from {out!r}")
          want, have = (pin.group(1), pin.group(2)), (got.group(1), got.group(2))
          print(f"pin={'.'.join(want)}.x  resolved={out}  at {binary}")
          if want != have:
              sys.exit(f"ast-grep on PATH is {out}, but requirements.txt pins "
                       f"{'.'.join(want)}.x. Two installs are shadowing each "
                       f"other; run `which -a ast-grep`.")
          PY

      # Same shape as the ast-grep check above, same reason: presence on PATH
      # is not enough if it's not the pinned version. semgrep backs the
      # software-architect-and-testing agent's ruleset (scripts/spring_semgrep_
      # rules.yml), not the deterministic signal-scan layer -- see CONSTRAINTS.md's
      # "Runtime prerequisites" for why it's a separate entry from ast-grep's.
      - name: Verify semgrep on PATH matches the pin
        run: |
          python3 - <<'PY'
          import re, shutil, subprocess, sys, pathlib
          pin = re.search(r"^semgrep~=(\d+)\.(\d+)\.",
                          pathlib.Path("requirements.txt").read_text(), re.M)
          if not pin:
              sys.exit("requirements.txt does not pin semgrep")
          binary = shutil.which("semgrep")
          if not binary:
              sys.exit("semgrep is not on PATH")
          out = subprocess.run([binary, "--version"], capture_output=True,
                               text=True).stdout.strip()
          got = re.search(r"(\d+)\.(\d+)\.(\d+)", out)
          if not got:
              sys.exit(f"could not parse a version from {out!r}")
          want, have = (pin.group(1), pin.group(2)), (got.group(1), got.group(2))
          print(f"pin={'.'.join(want)}.x  resolved={out}  at {binary}")
          if want != have:
              sys.exit(f"semgrep on PATH is {out}, but requirements.txt pins "
                       f"{'.'.join(want)}.x. Two installs are shadowing each "
                       f"other; run `which -a semgrep`.")
          PY

      # Lint and import order. Rule selection, the 110-character line length
      # (derived from this repo's own p99.5, not from a style guide), and the
      # two deliberately-deferred rule families with their counts all live in
      # .ruff.toml. This step fails the build.
      - name: ruff check (lint scripts + src/doc_engine)
        run: python3 -m ruff check --no-cache scripts/ src/doc_engine/

      # NOT wired, deliberately: `ruff format --check`. Measured 2026-07-24 --
      # 29 of 33 files in scripts/ would be reformatted. Adopting the
      # formatter means one mechanical commit touching nearly every file,
      # which would bury every subsequent diff and blame line, so it is its
      # own decision with its own .git-blame-ignore-revs entry rather than a
      # side effect of adding a linter. Stated here with the number rather
      # than left as an unexplained absence.

      # Annotation coverage + docstring orientation (hard); size/complexity/
      # depth print as advisory only (schema v4). Baseline:
      # scripts/ratchets/code_quality_baseline.json. Regenerate with `--update` when
      # annotation/docstring floors genuinely improve or the measured set grows.
      - name: check_no_client_identifiers.py (tracked-tree denylist)
        run: python3 scripts/ci/check_no_client_identifiers.py --tracked-tree

      - name: check_code_quality.py (annotation + docstring hard; size advisory)
        run: python3 scripts/ci/check_code_quality.py

      # Reads this repo's claims about itself back: every steering prompt's
      # verify: predicates, every derived: count, every backticked repo path
      # and symbol() in the current-state docs, that every test suite is
      # actually wired here, and that no step is named as a gate it cannot
      # be. Blocks, with no ENFORCE toggle -- it is local, deterministic,
      # needs no network and makes zero LLM calls, so it has none of the
      # excuses check_llms_coverage.py has.
      #
      # It decides whether a claim is well-formed and resolvable, never
      # whether it is true; that judgment stays in CLAUDE.md's human pass.
      # Pre-existing findings ride scripts/ratchets/repo_claims_baseline.json, the
      # same ratchet shape as check_code_quality.py.
      - name: check_repo_claims.py (state-claim gate)
        run: python3 scripts/ci/check_repo_claims.py

      # Every ast-grep rule must be able to match something. Measured against
      # a real production Spring service, 10 of 23 rules fired and 13 returned
      # zero -- and nothing here could tell "this codebase has no Kafka" from
      # "this rule is broken". Only the fixture corpus runs in CI: it is
      # committed and tiny. The real-corpus ratchet needs a checkout too large
      # to track, so it runs on a dev machine and commits its baseline, the
      # same shape check_code_quality.py uses. This step fails the build.
      - name: rule_coverage.py (rule non-vacuity gate)
        run: python3 scripts/coverage/rule_coverage.py

      # semgrep: every rule in scripts/coverage/spring_semgrep_rules.yml must
      # fire on scripts/coverage/semgrep_rule_fixtures/ (non-vacuity) and must
      # not gain hits on scripts/coverage/semgrep_rule_fixtures_negative/
      # beyond scripts/coverage/semgrep_rule_fp_baseline.json (hermetic FP
      # ratchet). Real-corpus recall baseline remains optional/dev-only and is
      # still absent — do not invent a client checkout name.
      - name: semgrep_rule_coverage.py (non-vacuity + FP ratchet)
        run: python3 scripts/coverage/semgrep_rule_coverage.py

      # Measurements, not a verdict -- this step cannot fail, and is named so
      # that reads as true at a glance rather than looking like enforcement.
      # It prints how many claims this repo makes about itself, how many carry
      # a verify: predicate that could contradict them, and the spread of
      # status words. Gating on any of those before someone has watched them
      # move is how a threshold gets picked that nobody can defend -- the same
      # reasoning recorded on check_code_quality.py's USAGE_WITHIN_LINES.
      - name: claim metrics (reports; never fails)
        run: python3 scripts/ci/check_repo_claims.py --metrics

      - name: pytest tests/ (line coverage ratchet on doc_engine + stf)
        run: |
          # Drop stale .coverage* so statement-only local data cannot clash with
          # branch=true from pyproject.toml (coverage raises cant-combine).
          rm -f .coverage .coverage.* coverage.xml
          pytest tests/ -v --tb=short \
            --cov=doc_engine --cov=stf \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ env.COV_FAIL_UNDER }}
        env:
          # Keep in lockstep with [tool.coverage.report] fail_under in pyproject.toml.
          # Floor is the integer of combined statement+branch Cover% on a clean run
          # (not coverage.xml line-rate, which is statement-only and reads higher).
          COV_FAIL_UNDER: "82"

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path("coverage.xml")
          if not path.is_file():
              print("coverage.xml missing — pytest may have failed before writing it")
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          pct = 100.0 * line_rate
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              f"### Line coverage (doc_engine + stf)\n\n"
              f"- Python `{os.environ.get('PYTHON_VERSION', '?')}`: **{pct:.2f}%** "
              f"(floor {os.environ.get('COV_FAIL_UNDER', '?')}%)\n",
              encoding="utf-8",
          )
          print(f"line coverage={pct:.2f}%")
          PY
        env:
          COV_FAIL_UNDER: "82"
          PYTHON_VERSION: ${{ matrix.python-version }}

      # Canonical coverage for SonarCloud (sonarcloud job downloads this).
      # success() only: a failed pytest cell must not publish a missing/partial
      # report that would zero out Coverage on New Code.
      - name: Upload coverage.xml (3.11 canonical)
        if: matrix.python-version == '3.11' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: validate_artifacts.py (spring_signals fixture schema)
        run: python3 -m doc_engine.tools.validate_artifacts spring_signals scripts/fixtures/spring_signals_fixture_expected.json

      # Live deterministic Stage 0 against the committed spring_signals fixture
      # tree, then schema-gate every known artifact the run produced. Requires
      # portable package ports (python -m doc_engine.tools.*) — not scripts/ paths.
      - name: portable Stage 0 (deterministic_only + artifact schema gate)
        run: |
          OUT=$(mktemp -d)
          doc-engine pipeline run scripts/fixtures/spring_signals \
            --out-dir "$OUT" \
            --compliance-profile deterministic_only \
            --skip-drift
          python3 -m doc_engine.tools.validate_artifacts --all "$OUT" \
            --require spring_signals,groups,cross_group_edges,capacity_preflight_report,facts,certification
          test -f "$OUT/certification.json"

      # Non-blocking on purpose: a survivor count needs to be watched before
      # anyone can defend a threshold, the same reasoning recorded on
      # check_code_quality.py's USAGE_WITHIN_LINES. ENFORCE = False in the
      # script, so check_gate_honesty requires "non-blocking" in this name.
      - name: mutate.py (mutation score; reports, non-blocking)
        run: python3 scripts/ratchets/mutate.py

      # Hand-targeted mutants for check-assertions.py (ten load-bearing
      # invariants). ENFORCE = False in the driver; check_gate_honesty only
      # scans scripts/, but the same honesty rule applies -- name must say
      # non-blocking until a zero-survivor threshold is defended.
      - name: spring-signals mutation_driver.py (assertion mutants; non-blocking)
        run: python3 tests/spring_signals/mutation_driver.py

      # REMOVED: the verify_llms_docs.py step. It extracted backtick-fenced
      # spans from LLM-authored markdown and ran them through `bash -c`, with
      # GH_TOKEN in scope, on every pull_request and push to main. The match
      # was on prefix, so any `;` in a span was arbitrary code execution
      # (reproduced: `git log -1; echo X > file` graded PASS, file written).
      # Removed per claude/10-architecture-maturation-plan.md scrap item 2
      # ("delete the mechanism; keep the intent") and 0.1.3 ("the C1 exposure
      # is closed by omission ... do not re-add it").
      #
      # claude/llms/pr-N.md survives as a human-read convention: its commands
      # are for a person to run deliberately, never for CI to execute.

      # Advisory only -- check_llms_coverage.py never fails CI. Redesign the
      # exemption heuristic or delete this step; do not reintroduce ENFORCE.
      # Name is quoted: an unquoted colon in a YAML scalar breaks the workflow.
      - name: "check_llms_coverage.py (advisory: merged PRs without claude/llms/pr-N.md)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/check_llms_coverage.py

  # Wave 0 static invariants for the spring-signals CodeQL pack. Runs without a
  # CodeQL CLI; the compile and runtime jobs below cover the CLI side (the ocs
  # database build remains the only piece that needs Artifactory). Exits
  # non-zero if the count-claim enforcer, layering checks, or or-or lint find
  # a violation.
  codeql-signals-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: spring-signals static invariants
        run: python3 spring-signals/harness/check-invariants.py

  # Compile the spring-signals CodeQL pack against the pinned library version.
  # This needs no database and no Artifactory; it only needs the public CodeQL
  # bundle. It is the first real gate that exercises the D6 construct list.
  codeql-signals-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up CodeQL
        uses: ./.github/actions/setup-codeql
        with:
          bundle-url: ${{ env.CODEQL_BUNDLE_URL }}
          bundle-sha256: ${{ env.CODEQL_SHA256 }}

      - name: Check CodeQL version
        run: codeql --version

      - name: Upload CodeQL bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-bundle
          path: ${{ runner.temp }}/codeql/codeql-bundle.tar.gz
          retention-days: 1

      - name: Install pack dependencies
        working-directory: spring-signals/codeql
        run: |
          codeql pack install packs/java-signals-lib
          codeql pack install packs/spring-signals
          codeql pack install packs/spring-signals/test

      - name: Compile spring-signals queries
        working-directory: spring-signals/codeql
        run: |
          codeql query compile --check-only --threads=0 \
            packs/spring-signals/*.ql

      - name: Run spring-signals QL tests
        working-directory: spring-signals/codeql
        run: |
          codeql test run --threads=0 \
            packs/spring-signals/test

  # Run the Wave 1 spring-signals queries against a local, self-contained
  # jar-based fixture with pinned Maven Central dependencies. This gate needs no
  # Artifactory credentials and catches runtime regressions that `query compile`
  # cannot (e.g. missing rows, wrong attribute extraction, double-counting). It
  # reuses the same public CodeQL bundle pinned above and asserts against the
  # hand-derived expectations in harness/expectations/fixture-repo.json.
  codeql-signals-runtime:
    runs-on: ubuntu-latest
    needs: codeql-signals-compile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Print Java toolchain
        run: |
          echo "javac: $(which javac)"
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Download CodeQL bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-bundle
          path: ${{ runner.temp }}/codeql-artifact/

      - name: Set up CodeQL
        uses: ./.github/actions/setup-codeql
        with:
          bundle-path: ${{ runner.temp }}/codeql-artifact/codeql-bundle.tar.gz
          bundle-sha256: ${{ env.CODEQL_SHA256 }}

      - name: Check CodeQL version
        run: codeql --version

      - name: Install pack dependencies
        working-directory: spring-signals/codeql
        run: |
          codeql pack install packs/java-signals-lib
          codeql pack install packs/spring-signals

      - name: Run spring-signals fixture runtime gate
        working-directory: spring-signals/harness
        run: ./create-test-db.sh

  # Hard in-repo quality gates (Free SonarCloud cannot customize QG thresholds).
  # Thresholds and tool evidence: CONTRIBUTING.md "In-repo quality gates".
  # Reuses coverage-xml from the 3.11 test cell. This job is the required
  # enforcement path; SonarCloud below is soft / non-blocking.
  quality-gates:
    name: quality-gates
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Download coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Resolve new-code compare ref
        id: compare
        env:
          # Prefer github.base_ref / github.event.before — not github.event.pull_request.*
          # (check_workflow_yaml treats those interpolations as script-injection).
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            REF="$(git merge-base HEAD "origin/$BASE_REF")"
          else
            REF="$PUSH_BEFORE"
            # New branch / first push: all-zero "before" — fall back to main tip.
            if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
              git fetch origin main --depth=1
              REF="$(git merge-base HEAD origin/main || git rev-parse origin/main)"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "compare_ref=$REF"

      - name: run_quality_gates.py (coverage / duplication / complexity / cycles)
        env:
          COMPARE_REF: ${{ steps.compare.outputs.ref }}
        run: |
          python3 scripts/ci/run_quality_gates.py \
            --compare-ref "$COMPARE_REF" \
            --coverage-xml coverage.xml

  # Soft SonarCloud signal only. Free-plan Quality Gates cannot enforce the
  # custom thresholds this repo needs; hard fail lives in quality-gates above.
  # continue-on-error keeps Sonar from blocking merges when the UI gate is
  # vacuous or misconfigured. Name says non-blocking on purpose.
  sonarcloud:
    name: "SonarCloud (non-blocking; Free QG not policy SoT)"
    needs: test
    runs-on: ubuntu-latest
    if: success()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for blame / new-code detection on PRs and main.
          fetch-depth: 0

      - name: Download coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Require coverage.xml for Sonar
        run: |
          test -f coverage.xml
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          print(f"coverage.xml line-rate={100.0 * line_rate:.2f}%")
          PY

      - name: SonarQube Scan (non-blocking)
        # Third-party action: check_workflow_yaml treats non-actions/* tags as
        # high/unpinned-action. Pin to the annotated tag's commit (v8.2.1).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=false
