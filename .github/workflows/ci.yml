name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history rather than the default shallow clone. The original
          # reason (verify_llms_docs.py resolving old SHAs) went away with
          # that script, but this is kept deliberately: check_llms_coverage.py
          # reasons about merged PRs, and a shallow clone silently changes
          # what git-based checks can see. Cheap at this repo's size, and a
          # shallow default is the kind of thing that fails confusingly later.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 3.11 is a deliberate, modern default, not an assumption carried
          # over from elsewhere. Third-party package versions are pinned in
          # requirements.txt (see CONSTRAINTS.md's "Runtime prerequisites"
          # item 4); the Python interpreter version itself isn't pinned via
          # that file, so this stays a hardcoded default.
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      # Presence is not enough. This step used to run `ast-grep --version` and
      # discard the answer, so it passed while the binary that actually
      # resolved on PATH was a different build from the one requirements.txt
      # pins -- exactly the shadowing recorded in claude/tool-quirks.md, which
      # was live on a dev machine while this step was green. The pinned
      # version is read from requirements.txt rather than written here, so
      # there is no second number to go stale.
      - name: Verify ast-grep on PATH matches the pin
        run: |
          python3 - <<'PY'
          import re, shutil, subprocess, sys, pathlib
          pin = re.search(r"^ast-grep-cli~=(\d+)\.(\d+)\.",
                          pathlib.Path("requirements.txt").read_text(), re.M)
          if not pin:
              sys.exit("requirements.txt does not pin ast-grep-cli")
          binary = shutil.which("ast-grep")
          if not binary:
              sys.exit("ast-grep is not on PATH")
          out = subprocess.run([binary, "--version"], capture_output=True,
                               text=True).stdout.strip()
          got = re.search(r"(\d+)\.(\d+)\.(\d+)", out)
          if not got:
              sys.exit(f"could not parse a version from {out!r}")
          want, have = (pin.group(1), pin.group(2)), (got.group(1), got.group(2))
          print(f"pin={'.'.join(want)}.x  resolved={out}  at {binary}")
          if want != have:
              sys.exit(f"ast-grep on PATH is {out}, but requirements.txt pins "
                       f"{'.'.join(want)}.x. Two installs are shadowing each "
                       f"other; run `which -a ast-grep`.")
          PY

      # Lint and import order. Rule selection, the 110-character line length
      # (derived from this repo's own p99.5, not from a style guide), and the
      # two deliberately-deferred rule families with their counts all live in
      # .ruff.toml. This step fails the build.
      - name: ruff check (lint)
        run: python3 -m ruff check --no-cache scripts/

      # NOT wired, deliberately: `ruff format --check`. Measured 2026-07-24 --
      # 29 of 33 files in scripts/ would be reformatted. Adopting the
      # formatter means one mechanical commit touching nearly every file,
      # which would bury every subsequent diff and blame line, so it is its
      # own decision with its own .git-blame-ignore-revs entry rather than a
      # side effect of adding a linter. Stated here with the number rather
      # than left as an unexplained absence.

      # The monotonic ratchet on function size, complexity, nesting depth, and
      # type-annotation coverage, compared against the committed
      # scripts/code_quality_baseline.json. Fails only on regression -- it
      # never asks for a refactor, only that these numbers not grow. Regenerate
      # deliberately with `--update` when something genuinely improves.
      - name: check_code_quality.py (ratchet)
        run: python3 scripts/check_code_quality.py

      # Reads this repo's claims about itself back: every steering prompt's
      # verify: predicates, every derived: count, every backticked repo path
      # and symbol() in the current-state docs, that every test suite is
      # actually wired here, and that no step is named as a gate it cannot
      # be. Blocks, with no ENFORCE toggle -- it is local, deterministic,
      # needs no network and makes zero LLM calls, so it has none of the
      # excuses check_llms_coverage.py has.
      #
      # It decides whether a claim is well-formed and resolvable, never
      # whether it is true; that judgment stays in CLAUDE.md's human pass.
      # Pre-existing findings ride scripts/repo_claims_baseline.json, the
      # same ratchet shape as check_code_quality.py.
      - name: check_repo_claims.py (state-claim gate)
        run: python3 scripts/check_repo_claims.py

      # Every ast-grep rule must be able to match something. Measured against
      # a real production Spring service, 10 of 23 rules fired and 13 returned
      # zero -- and nothing here could tell "this codebase has no Kafka" from
      # "this rule is broken". Only the fixture corpus runs in CI: it is
      # committed and tiny. The real-corpus ratchet needs a checkout too large
      # to track, so it runs on a dev machine and commits its baseline, the
      # same shape check_code_quality.py uses. This step fails the build.
      - name: rule_coverage.py (rule non-vacuity gate)
        run: python3 scripts/rule_coverage.py

      # Measurements, not a verdict -- this step cannot fail, and is named so
      # that reads as true at a glance rather than looking like enforcement.
      # It prints how many claims this repo makes about itself, how many carry
      # a verify: predicate that could contradict them, and the spread of
      # status words. Gating on any of those before someone has watched them
      # move is how a threshold gets picked that nobody can defend -- the same
      # reasoning recorded on check_code_quality.py's USAGE_WITHIN_LINES.
      - name: claim metrics (reports; never fails)
        run: python3 scripts/check_repo_claims.py --metrics

      - name: test_spring_signal_scan.py
        run: python3 scripts/test_spring_signal_scan.py -v

      - name: test_partition_repo.py
        run: python3 scripts/test_partition_repo.py -v

      - name: test_spring_drift_check.py
        run: python3 scripts/test_spring_drift_check.py -v

      - name: test_pipeline_stages.py
        run: python3 scripts/test_pipeline_stages.py -v

      - name: test_secret_heuristics.py
        run: python3 scripts/test_secret_heuristics.py -v

      - name: test_config_keys.py
        run: python3 scripts/test_config_keys.py -v

      - name: test_semantic_eval_helpers.py
        run: python3 scripts/test_semantic_eval_helpers.py -v

      - name: test_capacity_preflight.py
        run: python3 scripts/test_capacity_preflight.py -v

      - name: test_run_manifest.py
        run: python3 scripts/test_run_manifest.py -v

      - name: test_build_cross_group_edges.py
        run: python3 scripts/test_build_cross_group_edges.py -v

      - name: test_check_llms_coverage.py
        run: python3 scripts/test_check_llms_coverage.py -v

      # Runs the real scanner and the real drift checker over the fixtures and
      # counts wrong verdicts, rather than asserting per-rule behaviour -- see
      # its docstring for the non-overlap contract with test_spring_drift_check.
      # ~10s, the slowest suite here, because every scenario shells out to
      # ast-grep twice. Skips itself if ast-grep is unavailable.
      - name: test_drift_normalization.py
        run: python3 scripts/test_drift_normalization.py -v

      # The checker itself isn't CI-wired -- like check_no_secrets_leaked.py,
      # it needs a completed target-repo run to check, and CI has none. Its
      # unit tests do run here.
      - name: test_check_pipeline_output.py
        run: python3 scripts/test_check_pipeline_output.py -v

      # Same shape: citation_coverage.py needs a completed run's docs/ plus the
      # target repo, so only its unit tests run here.
      - name: test_citation_coverage.py
        run: python3 scripts/test_citation_coverage.py -v

      # Covers the ratchet itself. Most of these tests exist for non-vacuity:
      # they assert each failure mode reaches a non-zero exit code, because a
      # ratchet that silently passes everything is indistinguishable from a
      # working one at the green checkmark.
      - name: test_check_code_quality.py
        run: python3 scripts/test_check_code_quality.py -v

      # Same posture as the suite above: most of these tests exist to prove
      # each check reaches a non-zero exit code on an injected defect, plus
      # a regression class pinning that markdown content can never reach a
      # shell -- the defect that got verify_llms_docs.py deleted.
      - name: test_check_repo_claims.py
        run: python3 scripts/test_check_repo_claims.py -v

      # Runtime half of the structural-search policy. check_repo_claims.py's
      # check F covers the static half (no agent definition may declare Grep);
      # this covers the half that static inspection cannot reach -- an agent
      # that lost the Grep tool but shells out to `grep` through Bash.
      - name: test_deny_text_search.py
        run: python3 scripts/test_deny_text_search.py -v

      - name: test_rule_coverage.py
        run: python3 scripts/test_rule_coverage.py -v

      # Reads the Stage-1/2/3 output contracts back out of agents/*.md and
      # asserts they still equal the constants the validators enforce. Those
      # constants were hand-copied from the prompts with nothing checking the
      # copy, so editing a prompt left test_pipeline_stages.py green while
      # validating the previous contract. Its PromptEditGoesRedTest class
      # carries the non-vacuity proof in the suite rather than as a ritual
      # someone performs once and writes down.
      - name: test_prompt_contracts.py
        run: python3 scripts/test_prompt_contracts.py -v

      # The expectation algebra over the evidence set, and the metamorphic
      # relations it exists to express. set_delta.py answers "was this change
      # the one we predicted?", which spring_drift_check.py cannot: it reports
      # that a citation moved, never whether the movement was expected. The
      # residue -- not the size of the delta -- is what fails, so a change that
      # legitimately adds a rule passes while a reformat that quietly moves a
      # member does not.
      - name: test_set_delta.py
        run: python3 scripts/test_set_delta.py -v

      # Metamorphic relations across input type and velocity. Closes two
      # bounds test_drift_normalization states it does not cover ("Only Java
      # is perturbed", "No encoding or line-ending perturbation"), and asserts
      # idempotence and locality, which no other suite here names.
      - name: test_metamorphic.py
        run: python3 scripts/test_metamorphic.py -v

      - name: test_mutate.py
        run: python3 scripts/test_mutate.py -v

      # The commit-time gate. Project-scoped rather than plugin-shipped: it
      # resolves the repo from its own location, so carrying it into another
      # checkout would have it checking this one.
      - name: test_require_hardened_tests.py
        run: python3 scripts/test_require_hardened_tests.py -v

      # Mechanises the ritual this repo's standing rule depends on -- break
      # the code, watch the tests go red, restore it -- which was performed by
      # hand, once, with no artifact proving it happened. Every mutation runs
      # against a copy of the tracked tree, never the working tree, and only
      # the one suite each mutator names.
      #
      # Non-blocking on purpose: a survivor count needs to be watched before
      # anyone can defend a threshold, the same reasoning recorded on
      # check_code_quality.py's USAGE_WITHIN_LINES. ENFORCE = False in the
      # script, so check_gate_honesty requires "non-blocking" in this name.
      - name: mutate.py (mutation score; reports, non-blocking)
        run: python3 scripts/mutate.py

      # The evidence for _ast_signature.py's default, kept executable. The
      # choice of t2 came from measurements taken in a throwaway script, and a
      # measurement made once in a scratch file decays exactly the way a claim
      # written in prose does -- so each measurement is a test here instead.
      # Verified non-vacuous by hand: making t2 stop stripping docstrings,
      # reverting the default to t1, and accepting an unknown level silently
      # each turn this suite red.
      - name: test_ast_signature.py
        run: python3 scripts/test_ast_signature.py -v

      # The kitchen-sink suite: the documented command series run as real
      # subprocesses against a deliberately hostile synthetic enterprise repo,
      # plus fault injection that closes the loop to each gate's actual process
      # exit code -- the two things no other suite here does. It is also the
      # only coverage run_pipeline_local.py has. Organized around DDIA's
      # chapters (encoding, replication, partitioning, lost updates, the
      # end-to-end argument), which is what decides both what it covers and how
      # hard it asserts. Stages 1-4 come from run_pipeline_local.py's mocks.
      #
      # This is the slowest step in the workflow: ~132s locally on Windows,
      # faster here since the cost is process startup rather than work. It
      # carries one deliberate expectedFailure (overlap cascading past adjacent
      # groups) -- if that ever reports an *unexpected success*, the underlying
      # defect was fixed and the marker should be deleted, not re-added.
      #
      # KITCHEN_SINK_REPO is unset on purpose: the opt-in real-repo lane is
      # local-only and outside this workflow's runtime budget.
      - name: test_enterprise_kitchen_sink.py
        run: python3 scripts/test_enterprise_kitchen_sink.py -v

      # REMOVED: the verify_llms_docs.py step. It extracted backtick-fenced
      # spans from LLM-authored markdown and ran them through `bash -c`, with
      # GH_TOKEN in scope, on every pull_request and push to main. The match
      # was on prefix, so any `;` in a span was arbitrary code execution
      # (reproduced: `git log -1; echo X > file` graded PASS, file written).
      # Removed per claude/10-architecture-maturation-plan.md scrap item 2
      # ("delete the mechanism; keep the intent") and 0.1.3 ("the C1 exposure
      # is closed by omission ... do not re-add it").
      #
      # claude/llms/pr-N.md survives as a human-read convention: its commands
      # are for a person to run deliberately, never for CI to execute.

      # NOTE: this step reports only — check_llms_coverage.py has ENFORCE = False,
      # so it prints findings and exits 0. The name says "reports", not "fails", on
      # purpose: a step named as a gate that cannot fail is worse than no gate,
      # because it reads as enforcement to anyone scanning the workflow. Rename
      # this back to "fails on ..." in the same change that sets ENFORCE = True.
      - name: check_llms_coverage.py (reports merged PRs with no claude/llms/pr-N.md; non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_llms_coverage.py
