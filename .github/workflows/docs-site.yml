name: Publish docs site

# Builds the 14-file Spring taxonomy site via build_docs_site.
# That tool is for *generated target-repo docs*, not this monorepo's
# docs/product-architecture.md tree. Auto-push against docs/** was a
# category error and failed on main after PR #59 moved the tool path.
# Operators pass an explicit docs_dir (workflow_dispatch only).

on:
  workflow_dispatch:
    inputs:
      docs_dir:
        description: "Directory with the 14 generated taxonomy markdown files (not this repo's docs/ product notes)"
        required: true
        default: ""
      site_name:
        description: "Site title"
        required: true
        default: "Repo Documentation"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Require docs_dir
        run: |
          if [ -z "${{ github.event.inputs.docs_dir }}" ]; then
            echo "error: docs_dir is required (path to the 14-file taxonomy, e.g. a pipeline out-dir docs/)." >&2
            exit 1
          fi

      - name: Build site
        run: |
          DOCS_DIR="${{ github.event.inputs.docs_dir }}"
          SITE_NAME="${{ github.event.inputs.site_name || 'Repo Documentation' }}"
          python3 -m doc_engine.tools.build_docs_site --docs-dir "$DOCS_DIR" --out-dir _site --site-name "$SITE_NAME"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
