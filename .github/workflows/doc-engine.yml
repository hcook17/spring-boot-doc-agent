name: doc-engine scan and publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo_path:
        description: "Path to the repository to scan (relative to workspace)"
        required: true
        default: "."
      scanners:
        description: "Comma-separated scanner names"
        required: true
        default: "filesystem,ast-grep"
      site_name:
        description: "Site title"
        required: true
        default: "Documentation"

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run doc-engine scan
        run: |
          REPO_PATH="${{ github.event.inputs.repo_path || '.' }}"
          SCANNERS="${{ github.event.inputs.scanners || 'filesystem,ast-grep' }}"
          doc-engine scan "$REPO_PATH" --out signals.json --scanners "$SCANNERS" --respect-gitignore

      - name: Run doc-engine docs
        run: doc-engine docs signals.json --out docs.json

      - name: Run doc-engine site
        run: doc-engine site docs.json --out-dir _site --site-name "${{ github.event.inputs.site_name || 'Documentation' }}"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Comment that docs were built
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "📚 Documentation site built by doc-engine workflow (see Actions artifacts on merge to main for GitHub Pages publish)."
            });
