name: doc-engine pipeline certification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo_path:
        description: "Path to the repository to scan (relative to workspace)"
        required: true
        default: "."
      compliance_profile:
        description: "scan_only, deterministic_only, or certified"
        required: true
        default: "scan_only"

permissions:
  contents: read
  pull-requests: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run pipeline (scan_only on fixture signals)
        run: |
          PROFILE="${{ github.event.inputs.compliance_profile || 'scan_only' }}"
          doc-engine pipeline run scripts/test_fixtures/spring_signals \
            --compliance-profile "$PROFILE" \
            --out-dir pipeline-artifacts \
            --skip-drift \
            --signals-file scripts/test_fixtures/spring_signals_fixture_expected.json

      - name: Gate certification.json
        run: python3 doc-engine certification verify pipeline-artifacts/certification.json

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - name: Comment certification result
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Pipeline certification passed (`scan_only` on fixture signals). See `pipeline-artifacts/certification.json` in the workflow log artifacts if uploaded."
            });
