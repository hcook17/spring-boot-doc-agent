name: Setup CodeQL
description: >
  Download or reuse a pinned CodeQL bundle, verify its SHA256, and add it to
  PATH. The two load-bearing values are declared inputs, not ambient env:
  the caller must state both the artifact and the digest it expects, which is
  what makes a digest change a reviewed diff.

inputs:
  bundle-url:
    description: >
      URL of the codeql-bundle tarball (a github/codeql-action release asset).
      Required unless bundle-path points at an existing archive.
    required: false
    default: ""
  bundle-sha256:
    description: SHA-256 of the tarball, from the release asset's digest field.
    required: true
  bundle-path:
    description: >
      Path to an existing codeql-bundle.tar.gz archive to use instead of
      downloading. If empty, the bundle is downloaded from bundle-url.
    required: false
    default: ""
  codeql-dir:
    description: Directory where CodeQL should be extracted.
    required: false
    default: ${{ runner.temp }}/codeql

outputs:
  codeql-dir:
    description: Directory where CodeQL was extracted.
    value: ${{ inputs.codeql-dir }}

runs:
  using: composite
  steps:
    - name: Download or reuse CodeQL bundle
      shell: bash
      env:
        BUNDLE_URL: ${{ inputs.bundle-url }}
        BUNDLE_SHA256: ${{ inputs.bundle-sha256 }}
        BUNDLE_PATH: ${{ inputs.bundle-path }}
        CODEQL_DIR: ${{ inputs.codeql-dir }}
      run: |
        set -euo pipefail

        if [ -z "$BUNDLE_PATH" ] && [ -z "$BUNDLE_URL" ]; then
          echo "ERROR: bundle-url is required when bundle-path is not set" >&2
          exit 1
        fi

        mkdir -p "$CODEQL_DIR"
        BUNDLE="$CODEQL_DIR/codeql-bundle.tar.gz"
        if [ -n "$BUNDLE_PATH" ]; then
          cp "$BUNDLE_PATH" "$BUNDLE"
        else
          curl -fsSL -o "$BUNDLE" "$BUNDLE_URL"
        fi
        echo "$BUNDLE_SHA256  $BUNDLE" | sha256sum -c -
        tar -xzf "$BUNDLE" -C "$CODEQL_DIR" --strip-components=1
        echo "$CODEQL_DIR" >> "$GITHUB_PATH"
        echo "Extracted CodeQL to $CODEQL_DIR"
