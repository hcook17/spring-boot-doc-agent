name: "Doc Engine"
description: "Run the document-spring-repo pipeline and gate on certification.json."
author: "Doc Engine Team"
branding:
  icon: "book-open"
  color: "blue"

inputs:
  repo-path:
    description: "Path to the repository to document (relative to the workspace)"
    required: false
    default: "."
  compliance-profile:
    description: "Pipeline profile: scan_only, deterministic_only, or certified"
    required: false
    default: "scan_only"
  pipeline-artifacts-dir:
    description: "Directory for pipeline artifacts and certification.json"
    required: false
    default: "pipeline-artifacts"
  respect-gitignore:
    description: "Pass --respect-gitignore to scan and partition stages"
    required: false
    default: "false"
  skip-drift:
    description: "Skip spring_drift_check.py after the pipeline run"
    required: false
    default: "true"
  signals-file:
    description: "Optional existing spring_signals.json to reuse (skips signal_scan)"
    required: false
    default: ""

outputs:
  certification-path:
    description: "Path to certification.json"
    value: ${{ steps.cert.outputs.certification-path }}
  certified:
    description: "Whether certification.json reports certified: true"
    value: ${{ steps.cert.outputs.certified }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install doc-engine
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run pipeline
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(
          pipeline run "${{ inputs.repo-path }}"
          --compliance-profile "${{ inputs.compliance-profile }}"
          --out-dir "${{ inputs.pipeline-artifacts-dir }}"
        )
        if [ "${{ inputs.respect-gitignore }}" = "true" ]; then
          ARGS+=(--respect-gitignore)
        fi
        if [ "${{ inputs.skip-drift }}" = "true" ]; then
          ARGS+=(--skip-drift)
        fi
        if [ -n "${{ inputs.signals-file }}" ]; then
          ARGS+=(--signals-file "${{ inputs.signals-file }}")
        fi
        doc-engine "${ARGS[@]}"

    - name: Gate certification
      id: cert
      shell: bash
      run: |
        set -euo pipefail
        CERT_PATH="${{ inputs.pipeline-artifacts-dir }}/certification.json"
        python3 doc-engine certification verify "$CERT_PATH"
        echo "certification-path=$CERT_PATH" >> "$GITHUB_OUTPUT"
        echo "certified=true" >> "$GITHUB_OUTPUT"
