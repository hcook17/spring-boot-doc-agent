# Library pack: language-scoped (Java), framework-agnostic.
#
# Everything reusable across frameworks lives here. A second framework
# (Micronaut, Quarkus, Jakarta EE) adds rows to Catalog.qll and a sibling
# query pack; it does not fork this library.
#
# A second *language* gets a sibling library pack (python-signals-lib, ...)
# that re-implements Schema.qll/Annotations.qll against that language's
# stdlib but emits the IDENTICAL row schema. The row schema is the
# cross-language contract, not the QL.
name: spring-signals/java-signals-lib
version: 0.1.0
library: true
dependencies:
  codeql/java-all: ^9.2.0
